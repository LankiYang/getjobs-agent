<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>示例公司 · 后端工程师网申</title>
<style>
  body { margin: 0; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f4f5f0; color: #1b1e1b; }
  .wrap { max-width: 720px; margin: 0 auto; padding: 48px 24px 64px; }
  h1 { font-size: 26px; margin: 0 0 6px; }
  .sub { color: #6b6f66; margin-bottom: 28px; }
  form { background: #fff; border: 1px solid #dcdcd2; padding: 28px; display: grid; gap: 18px; }
  label { display: block; font-size: 13px; color: #555a51; margin-bottom: 6px; }
  input[type=text], input[type=email], input[type=tel], select {
    width: 100%; padding: 10px 12px; font-size: 15px; border: 1px solid #c9c9bd; border-radius: 2px; background: #fff;
  }
  input[type=file] { font-size: 13px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  button { background: #1f4d3d; color: #fff; border: none; padding: 12px 18px; font-size: 15px; border-radius: 2px; cursor: pointer; justify-self: start; }
  .success { background: #eaf3ec; border: 1px solid #b9d4c2; padding: 24px; }
  .success h2 { margin: 0 0 10px; color: #1f4d3d; }
  .success p { margin: 4px 0; font-size: 14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>示例公司 · 后端工程师</h1>
  <div class="sub">在线申请（此页面仅用于测试 agent 自动填表）</div>
  <form id="form">
    <div class="row">
      <div><label for="name">姓名</label><input id="name" name="name" type="text" autocomplete="off" /></div>
      <div><label for="phone">手机号</label><input id="phone" name="phone" type="tel" autocomplete="off" /></div>
    </div>
    <div><label for="email">邮箱</label><input id="email" name="email" type="email" autocomplete="off" /></div>
    <div class="row">
      <div>
        <label for="education">最高学历</label>
        <select id="education" name="education">
          <option value="">请选择</option>
          <option value="本科">本科</option>
          <option value="硕士">硕士</option>
          <option value="博士">博士</option>
        </select>
      </div>
      <div>
        <label for="years">工作年限</label>
        <select id="years" name="years">
          <option value="">请选择</option>
          <option value="1-3年">1-3 年</option>
          <option value="3-5年">3-5 年</option>
          <option value="5-10年">5-10 年</option>
          <option value="10年以上">10 年以上</option>
        </select>
      </div>
    </div>
    <div><label for="resume">附件简历（图片或 PDF）</label><input id="resume" name="resume" type="file" accept="image/*,.pdf" /></div>
    <label class="check"><input id="agree" name="agree" type="checkbox" /> 我已阅读并同意隐私协议</label>
    <button id="submit" type="submit">提交申请</button>
  </form>
  <div id="result"></div>
</div>
<script>
  document.getElementById('form').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const phone = document.getElementById('phone').value.trim();
    const email = document.getElementById('email').value.trim();
    const education = document.getElementById('education').value;
    const years = document.getElementById('years').value;
    const agree = document.getElementById('agree').checked;
    const resume = document.getElementById('resume').files.length;
    if (!name || !phone || !email || !education || !agree) {
      document.getElementById('result').innerHTML = '<div class="success"><h2>请补全信息</h2><p>姓名、手机、邮箱、学历和隐私协议为必填。</p></div>';
      return;
    }
    document.getElementById('form').style.display = 'none';
    document.getElementById('result').innerHTML = `
      <div class="success">
        <h2>提交成功</h2>
        <p>姓名：${name}</p>
        <p>手机：${phone}</p>
        <p>邮箱：${email}</p>
        <p>学历：${education} · 经验：${years || '未填'}</p>
        <p>简历附件：${resume ? '已上传' : '未上传'}</p>
      </div>`;
  });
</script>
</body>
</html>
