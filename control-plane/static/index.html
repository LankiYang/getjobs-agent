<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>GetJobs Agent</title>
<style>
  :root { --bg:#0b1020; --panel:#151b2e; --panel2:#1c2440; --text:#e8ecf7; --muted:#8b94ad; --accent:#6c8cff; --green:#37c58b; --red:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background:radial-gradient(1200px 600px at 20% 0%, #1b2547 0%, var(--bg) 55%); color:var(--text); min-height:100vh; }
  .hidden { display:none !important; }
  .auth-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .auth-card { width:min(420px, 100%); background:var(--panel); border:1px solid #263050; border-radius:16px; padding:28px; box-shadow:0 20px 60px rgba(0,0,0,.35); }
  .auth-card h1 { margin:0 0 6px; font-size:22px; }
  .auth-card p { margin:0 0 20px; color:var(--muted); font-size:13px; }
  label { display:block; font-size:12px; color:var(--muted); margin:12px 0 6px; }
  input, textarea { width:100%; background:#0f1526; border:1px solid #2a3555; color:var(--text); border-radius:10px; padding:11px 12px; font-size:14px; outline:none; }
  input:focus, textarea:focus { border-color:var(--accent); }
  button { cursor:pointer; border:none; border-radius:10px; padding:11px 16px; font-size:14px; color:#fff; background:var(--accent); transition:opacity .15s; }
  button:hover { opacity:.9; }
  button.ghost { background:transparent; border:1px solid #2f3b5f; color:var(--text); }
  button.danger { background:#a83333; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  .row { display:flex; gap:10px; align-items:center; }
  .link { color:var(--accent); cursor:pointer; font-size:13px; }
  .error { color:var(--red); font-size:13px; margin-top:12px; white-space:pre-wrap; }
  .app { display:grid; grid-template-columns:280px 1fr; min-height:100vh; }
  .side { background:rgba(14,19,36,.85); border-right:1px solid #222b47; padding:20px; display:flex; flex-direction:column; gap:18px; }
  .brand { font-size:18px; font-weight:700; }
  .brand span { color:var(--accent); }
  .side-block { background:var(--panel); border:1px solid #232d4b; border-radius:12px; padding:14px; }
  .side-block h3 { margin:0 0 10px; font-size:12px; color:var(--muted); font-weight:600; letter-spacing:.04em; }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--red); display:inline-block; margin-right:8px; }
  .dot.on { background:var(--green); }
  .muted { color:var(--muted); font-size:12px; }
  .channels { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:12px; padding:4px 9px; border-radius:999px; background:#222c4b; color:var(--muted); }
  .chip.on { background:rgba(108,140,255,.18); color:#b9c8ff; }
  .main { display:flex; flex-direction:column; height:100vh; }
  .topbar { padding:14px 22px; border-bottom:1px solid #222b47; display:flex; justify-content:space-between; align-items:center; }
  .topbar .who { font-size:13px; color:var(--muted); }
  .chat { flex:1; overflow-y:auto; padding:22px; display:flex; flex-direction:column; gap:14px; }
  .msg { max-width:min(720px, 86%); padding:12px 14px; border-radius:14px; font-size:14px; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
  .msg.user { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
  .msg.bot { align-self:flex-start; background:var(--panel2); border:1px solid #273255; border-bottom-left-radius:4px; }
  .msg.system { align-self:center; background:transparent; color:var(--muted); font-size:12px; }
  .tools { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .tool { font-size:11px; color:#9fb0e0; background:#1a2340; border:1px solid #2a3555; padding:2px 8px; border-radius:999px; }
  .composer { border-top:1px solid #222b47; padding:14px 22px; display:flex; gap:10px; align-items:flex-end; }
  .composer textarea { resize:none; min-height:46px; max-height:160px; }
  .composer button { height:46px; min-width:88px; }
  .modal { position:fixed; inset:0; background:rgba(4,7,15,.7); display:flex; align-items:center; justify-content:center; padding:20px; z-index:20; }
  .modal-card { background:var(--panel); border:1px solid #2a3555; border-radius:16px; padding:20px; width:min(420px,100%); text-align:center; }
  .modal-card img { width:260px; height:260px; object-fit:contain; background:#fff; border-radius:12px; margin:12px auto; display:block; }
  .spinner { width:16px; height:16px; border:2px solid rgba(255,255,255,.3); border-top-color:#fff; border-radius:50%; display:inline-block; animation:spin .8s linear infinite; vertical-align:-3px; margin-right:6px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (max-width: 860px) { .app { grid-template-columns:1fr; } .side { display:none; } }
</style>
</head>
<body>

<div id="auth" class="auth-wrap">
  <div class="auth-card">
    <h1>GetJobs <span style="color:var(--accent)">Agent</span></h1>
    <p>对话式求职投递 · 每个账号独立运行环境</p>
    <label>邮箱</label>
    <input id="email" type="email" placeholder="you@example.com" autocomplete="username" />
    <label>密码</label>
    <input id="password" type="password" placeholder="至少 8 位" autocomplete="current-password" />
    <div class="row" style="margin-top:18px">
      <button id="loginBtn" style="flex:1">登录</button>
      <button id="registerBtn" class="ghost" style="flex:1">注册</button>
    </div>
    <div id="authError" class="error"></div>
  </div>
</div>

<div id="app" class="app hidden">
  <aside class="side">
    <div class="brand">GetJobs <span>Agent</span></div>
    <div class="side-block">
      <h3>我的运行环境</h3>
      <div style="margin-bottom:10px"><span id="runnerDot" class="dot"></span><span id="runnerText" class="muted">未启动</span></div>
      <div class="row">
        <button id="startRunner" style="flex:1">启动</button>
        <button id="stopRunner" class="ghost" style="flex:1">停止</button>
      </div>
      <div id="runnerHint" class="muted" style="margin-top:8px"></div>
    </div>
    <div class="side-block">
      <h3>渠道</h3>
      <div id="channels" class="channels"></div>
      <button id="loginBoss" class="ghost" style="width:100%;margin-top:12px">Boss 扫码登录</button>
    </div>
    <div style="margin-top:auto" class="row">
      <span id="who" class="muted" style="flex:1"></span>
      <button id="logoutBtn" class="ghost" style="padding:8px 12px">退出</button>
    </div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div>对话</div>
      <div class="who">说“帮我投 XX 方向”，agent 会补齐条件并执行</div>
    </div>
    <div id="chat" class="chat">
      <div class="msg system">这是你的专属投递环境。先启动运行环境，Boss 需要扫码登录。</div>
    </div>
    <div class="composer">
      <textarea id="input" placeholder="例如：帮我投大模型方向，城市上海，薪资 20-30K"></textarea>
      <button id="sendBtn">发送</button>
    </div>
  </main>
</div>

<div id="qrModal" class="modal hidden">
  <div class="modal-card">
    <h3 style="margin:0 0 6px">Boss 扫码登录</h3>
    <div class="muted">用 Boss 直聘 App 扫描二维码</div>
    <img id="qrImg" alt="二维码" />
    <div class="row" style="justify-content:center;margin-top:8px">
      <button id="refreshQr" class="ghost">刷新</button>
      <button id="closeQr" class="ghost">关闭</button>
    </div>
    <div id="qrError" class="error"></div>
  </div>
</div>

<script>
const state = { token: localStorage.getItem('getjobs_token') || '', user: null, sessionId: localStorage.getItem('getjobs_session') || '', busy: false };
const $ = (id) => document.getElementById(id);

function show(id, yes) { $(id).classList.toggle('hidden', !yes); }
function setError(id, message) { $(id).textContent = message || ''; }

async function api(path, options = {}) {
  const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch(path, Object.assign({}, options, { headers }));
  if (res.status === 401) { logout(); throw new Error('登录已过期，请重新登录'); }
  const text = await res.text();
  let data;
  try { data = text ? JSON.parse(text) : {}; } catch { data = text; }
  if (!res.ok) {
    let message = data;
    if (typeof data === 'object' && data) {
      message = data.detail || data.message || JSON.stringify(data);
      if (message && typeof message === 'object') message = message.message || JSON.stringify(message);
    }
    throw new Error(message || ('请求失败 ' + res.status));
  }
  return data;
}

function logout() {
  state.token = ''; state.user = null;
  localStorage.removeItem('getjobs_token');
  show('app', false); show('auth', true);
}

function addMessage(role, text, tools) {
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.textContent = text;
  if (tools && tools.length) {
    const box = document.createElement('div');
    box.className = 'tools';
    tools.forEach(t => {
      const chip = document.createElement('span');
      chip.className = 'tool';
      chip.textContent = t.name + (t.result && t.result.error ? ' ✕' : ' ✓');
      box.appendChild(chip);
    });
    el.appendChild(box);
  }
  $('chat').appendChild(el);
  $('chat').scrollTop = $('chat').scrollHeight;
}

async function loadMe() {
  const data = await api('/api/me');
  state.user = data.user;
  $('who').textContent = data.user.email;
  await loadRunner();
  await loadChannels();
}

async function loadRunner() {
  try {
    const data = await api('/api/me/runner');
    const running = !!data.running;
    $('runnerDot').classList.toggle('on', running);
    $('runnerText').textContent = running ? ('运行中 · 端口 ' + data.port) : '未启动';
    $('startRunner').disabled = running || state.busy;
    $('stopRunner').disabled = !running || state.busy;
  } catch (e) { /* ignore */ }
}

async function loadChannels() {
  try {
    const data = await api('/api/channels');
    $('channels').innerHTML = '';
    data.channels.forEach(c => {
      const chip = document.createElement('span');
      chip.className = 'chip' + (c.maintained ? ' on' : '');
      chip.textContent = c.label + (c.maintained ? '' : '（不维护）');
      $('channels').appendChild(chip);
    });
  } catch (e) { /* ignore */ }
}

async function startRunner() {
  state.busy = true; $('startRunner').disabled = true;
  $('startRunner').innerHTML = '<span class="spinner"></span>启动中';
  $('runnerHint').textContent = '首次启动约 5-10 秒，需要 JDK 和 Chrome';
  try {
    await api('/api/me/runner/start', { method: 'POST' });
    $('runnerHint').textContent = '';
  } catch (e) {
    $('runnerHint').textContent = e.message;
  }
  state.busy = false;
  $('startRunner').innerHTML = '启动';
  loadRunner();
}

async function stopRunner() {
  state.busy = true;
  try { await api('/api/me/runner/stop', { method: 'POST' }); }
  catch (e) { $('runnerHint').textContent = e.message; }
  state.busy = false;
  loadRunner();
}

async function sendMessage() {
  const input = $('input');
  const text = input.value.trim();
  if (!text || state.busy) return;
  input.value = '';
  addMessage('user', text);
  state.busy = true; $('sendBtn').disabled = true; $('sendBtn').innerHTML = '<span class="spinner"></span>';

  const pending = document.createElement('div');
  pending.className = 'msg system';
  pending.textContent = '思考中…';
  $('chat').appendChild(pending);

  try {
    const data = await api('/api/agent/chat', {
      method: 'POST',
      body: JSON.stringify({ message: text, session_id: state.sessionId || null })
    });
    state.sessionId = data.sessionId;
    localStorage.setItem('getjobs_session', data.sessionId);
    pending.remove();
    addMessage('bot', data.reply || '(无回复)', data.toolCalls);
    (data.qrUrls || []).forEach(url => showQr(url));
  } catch (e) {
    pending.remove();
    addMessage('system', '出错了：' + e.message);
  }
  state.busy = false; $('sendBtn').disabled = false; $('sendBtn').textContent = '发送';
}

async function openQr() {
  try {
    await api('/api/channels/boss/login', { method: 'POST' });
    await showQr('/api/channels/boss/login/qr');
  } catch (e) { addMessage('system', '打开登录页失败：' + e.message); }
}

async function showQr(url) {
  show('qrModal', true); setError('qrError', '');
  $('qrImg').removeAttribute('src');
  try {
    const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + state.token } });
    if (!res.ok) throw new Error('二维码获取失败 ' + res.status);
    const blob = await res.blob();
    $('qrImg').src = URL.createObjectURL(blob);
  } catch (e) {
    setError('qrError', e.message + '（确认已点击“Boss 扫码登录”）');
  }
}

function bind() {
  $('loginBtn').onclick = async () => {
    setError('authError', '');
    try {
      const data = await api('/api/auth/login', { method: 'POST', body: JSON.stringify({ email: $('email').value, password: $('password').value }) });
      state.token = data.token; localStorage.setItem('getjobs_token', data.token);
      show('auth', false); show('app', true); loadMe();
    } catch (e) { setError('authError', e.message); }
  };
  $('registerBtn').onclick = async () => {
    setError('authError', '');
    try {
      const data = await api('/api/auth/register', { method: 'POST', body: JSON.stringify({ email: $('email').value, password: $('password').value }) });
      state.token = data.token; localStorage.setItem('getjobs_token', data.token);
      show('auth', false); show('app', true); loadMe();
    } catch (e) { setError('authError', e.message); }
  };
  $('logoutBtn').onclick = logout;
  $('startRunner').onclick = startRunner;
  $('stopRunner').onclick = stopRunner;
  $('sendBtn').onclick = sendMessage;
  $('loginBoss').onclick = openQr;
  $('closeQr').onclick = () => show('qrModal', false);
  $('refreshQr').onclick = () => showQr($('qrImg').src ? '/api/channels/boss/login/qr' : '/api/channels/boss/login/qr');
  $('input').addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });
}

bind();
if (state.token) { show('auth', false); show('app', true); loadMe().catch(() => logout()); }
setInterval(() => { if (state.token && !state.busy) loadRunner(); }, 5000);
</script>
</body>
</html>
