<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>投递台账 · GetJobs Agent</title>
<style>
  :root {
    --paper: #f2f3ee;
    --paper-2: #fafaf6;
    --ink: #181b18;
    --ink-soft: #383c37;
    --muted: #6c6f66;
    --line: #d8d7cd;
    --line-strong: #b9b8ac;
    --seal: #b23a2e;
    --seal-soft: #f4e7e3;
    --green: #2f4f43;
    --amber: #9a6b1f;
    --serif: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
    --sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Consolas, monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    font-family: var(--sans);
    color: var(--ink);
    background-color: var(--paper);
    background-image:
      linear-gradient(90deg, transparent 0 39px, rgba(24,27,24,.045) 39px 40px, transparent 40px),
      repeating-linear-gradient(0deg, transparent 0 31px, rgba(24,27,24,.035) 31px 32px);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
  }
  body::before {
    content: "";
    position: fixed; inset: 0 0 auto 0; height: 4px;
    background: var(--seal);
    z-index: 30;
  }
  .hidden { display: none !important; }
  button { font-family: inherit; cursor: pointer; }
  ::selection { background: var(--seal); color: #fff; }
  :focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }

  /* ---------- auth ---------- */
  .auth-screen {
    height: 100vh;
    overflow-y: auto;
    display: grid;
    grid-template-columns: 1.15fr .85fr;
  }
  .auth-lede {
    padding: 72px clamp(32px, 7vw, 96px);
    display: flex; flex-direction: column; justify-content: center;
    border-right: 1px solid var(--line);
    position: relative;
  }
  .auth-lede::after {
    content: "";
    position: absolute; top: 72px; bottom: 72px; right: -1px; width: 3px;
    background: linear-gradient(to bottom, var(--seal) 0 96px, transparent 96px);
  }
  .stamp {
    width: 44px; height: 44px;
    background: var(--seal); color: #fff;
    font-family: var(--serif); font-size: 26px; font-weight: 700;
    display: grid; place-items: center;
    transform: rotate(-2.5deg);
    box-shadow: inset 0 0 0 2px rgba(255,255,255,.25);
    margin-bottom: 28px;
  }
  .brandline { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .brand-title {
    font-family: var(--serif);
    font-size: clamp(32px, 4vw, 44px);
    font-weight: 700; letter-spacing: .02em; margin: 0;
  }
  .brand-en {
    font-family: var(--mono); font-size: 12px; letter-spacing: .18em;
    color: var(--muted); text-transform: uppercase;
  }
  .lede {
    font-family: var(--serif);
    font-size: clamp(20px, 2.2vw, 26px);
    line-height: 1.75; max-width: 22ch;
    margin: 36px 0 0; color: var(--ink-soft);
  }
  .lede em { font-style: normal; color: var(--seal); }
  .lede-note {
    margin-top: 44px; max-width: 34ch;
    font-size: 13px; line-height: 1.9; color: var(--muted);
    border-top: 1px solid var(--line); padding-top: 18px;
  }
  .auth-panel {
    background: var(--paper-2);
    display: flex; flex-direction: column; justify-content: center;
    padding: 64px clamp(28px, 5vw, 72px);
  }
  .auth-panel h2 {
    font-family: var(--serif); font-size: 24px; margin: 0 0 6px; font-weight: 700;
  }
  .auth-panel .hint { font-size: 13px; color: var(--muted); margin: 0 0 32px; }
  .field { margin-bottom: 26px; }
  .field label {
    display: block; font-size: 12px; color: var(--muted); margin-bottom: 8px;
    letter-spacing: .02em;
  }
  .field input {
    width: 100%; background: transparent; border: none;
    border-bottom: 1px solid var(--line-strong);
    padding: 8px 2px 10px; font-size: 15px; color: var(--ink);
    font-family: var(--sans); border-radius: 0;
  }
  .field input:focus { outline: none; border-bottom: 2px solid var(--ink); }
  .auth-actions { display: flex; gap: 12px; margin-top: 8px; }
  .btn {
    border: 1px solid var(--ink); background: var(--ink); color: var(--paper-2);
    padding: 12px 20px; font-size: 14px; border-radius: 2px;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .btn:hover { background: var(--seal); border-color: var(--seal); color: #fff; }
  .btn:disabled {
    opacity: 1; cursor: not-allowed;
    background: var(--line); border-color: var(--line); color: var(--muted);
  }
  .btn.ghost { background: transparent; color: var(--ink); border-color: var(--line-strong); }
  .btn.ghost:hover { border-color: var(--ink); background: transparent; }
  .btn.tiny { padding: 8px 12px; font-size: 13px; }
  .auth-actions .btn { flex: 1; }
  .error {
    color: var(--seal); font-size: 13px; line-height: 1.6;
    margin-top: 18px; min-height: 20px;
  }

  /* ---------- app ---------- */
  .app { height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
  .topbar {
    display: flex; align-items: center; gap: 18px;
    padding: 20px clamp(18px, 3vw, 36px) 16px;
    border-bottom: 1px solid var(--line);
  }
  .topbar .stamp { width: 36px; height: 36px; font-size: 21px; margin: 0; }
  .topbar .brand-title { font-size: 24px; }
  .topbar .brand-en { display: none; }
  .topbar .who {
    margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted);
  }
  .linkish {
    background: none; border: none; color: var(--muted); font-size: 13px;
    padding: 4px 0; border-bottom: 1px solid transparent;
  }
  .linkish:hover { color: var(--ink); border-bottom-color: var(--ink); }

  .layout { flex: 1; display: grid; grid-template-columns: 292px 1fr; min-height: 0; }
  .side {
    border-right: 1px solid var(--line);
    padding: 24px clamp(16px, 2vw, 24px);
    display: flex; flex-direction: column; gap: 26px;
    background: rgba(250,250,246,.55);
  }
  .side-block h3 {
    font-family: var(--serif); font-size: 15px; font-weight: 700;
    margin: 0 0 12px; padding-bottom: 8px;
    border-bottom: 1px solid var(--line); letter-spacing: .02em;
  }
  .status-line { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; background: var(--line-strong);
    flex: none;
  }
  .dot.on { background: var(--green); box-shadow: 0 0 0 3px rgba(47,79,67,.14); }
  .dot.busy { background: var(--amber); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .port { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .side-actions { display: flex; gap: 8px; margin-top: 14px; }
  .side-actions .btn { flex: 1; }
  .side-hint { margin-top: 10px; font-size: 12px; color: var(--muted); line-height: 1.6; min-height: 16px; }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    font-size: 12px; padding: 5px 10px; border: 1px solid var(--line-strong);
    color: var(--muted); border-radius: 2px; background: transparent;
  }
  .chip.on { border-color: var(--green); color: var(--green); }

  .ledger { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; border: 1px solid var(--line); }
  .ledger div {
    padding: 12px 10px; border-right: 1px solid var(--line); text-align: left;
  }
  .ledger div:last-child { border-right: none; }
  .ledger .num { font-family: var(--serif); font-size: 26px; line-height: 1.1; }
  .ledger .lbl { font-size: 11px; color: var(--muted); margin-top: 6px; }

  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .chat {
    flex: 1; min-height: 0; overflow-y: auto; padding: 30px clamp(18px, 4vw, 56px) 24px;
    display: flex; flex-direction: column; gap: 22px;
    scroll-behavior: smooth;
  }
  .empty {
    margin: auto; max-width: 46ch; text-align: left; padding: 24px 0;
  }
  .empty h2 {
    font-family: var(--serif); font-size: clamp(22px, 2.6vw, 30px);
    line-height: 1.6; margin: 0 0 14px; font-weight: 700;
  }
  .empty p { color: var(--muted); font-size: 14px; line-height: 1.9; margin: 0 0 24px; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 10px; }
  .suggestion {
    background: transparent; border: 1px solid var(--line-strong);
    color: var(--ink-soft); padding: 9px 14px; font-size: 13px; border-radius: 2px;
    transition: border-color .15s ease, color .15s ease;
  }
  .suggestion:hover { border-color: var(--seal); color: var(--seal); }

  .msg { max-width: min(720px, 88%); animation: rise .18s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
  .msg .who-label {
    font-family: var(--mono); font-size: 10.5px; letter-spacing: .12em;
    color: var(--muted); margin-bottom: 7px;
  }
  .msg .body { font-size: 15px; line-height: 1.85; white-space: pre-wrap; word-break: break-word; }
  .msg .body.md { white-space: normal; }
  .msg .body.md > :first-child { margin-top: 0; }
  .msg .body.md > :last-child { margin-bottom: 0; }
  .msg .body.md p { margin: 0 0 10px; }
  .msg .body.md h1, .msg .body.md h2, .msg .body.md h3, .msg .body.md h4 {
    font-family: var(--serif); font-weight: 700; line-height: 1.5;
    margin: 18px 0 8px;
  }
  .msg .body.md h1 { font-size: 21px; }
  .msg .body.md h2 { font-size: 18px; }
  .msg .body.md h3 { font-size: 16px; }
  .msg .body.md h4 { font-size: 15px; }
  .msg .body.md ul, .msg .body.md ol { margin: 6px 0 10px; padding-left: 22px; }
  .msg .body.md li { margin: 3px 0; }
  .msg .body.md code {
    font-family: var(--mono); font-size: 12.5px;
    background: rgba(24,27,24,.06); padding: 1px 5px; border-radius: 2px;
  }
  .msg .body.md pre {
    background: var(--paper-2); border: 1px solid var(--line);
    padding: 12px 14px; margin: 10px 0; overflow-x: auto;
  }
  .msg .body.md pre code { background: none; padding: 0; font-size: 12.5px; }
  .msg .body.md blockquote {
    margin: 10px 0; padding: 2px 0 2px 12px;
    border-left: 2px solid var(--line-strong); color: var(--muted);
  }
  .msg .body.md a { color: var(--seal); text-underline-offset: 3px; }
  .msg .body.md table { border-collapse: collapse; margin: 10px 0; font-size: 13.5px; }
  .msg .body.md th, .msg .body.md td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; }
  .msg .body.md th { background: rgba(24,27,24,.04); font-weight: 600; }
  .msg .body.md hr { border: none; border-top: 1px solid var(--line); margin: 14px 0; }
  .msg .body.md strong { font-weight: 700; }
  .msg.agent { align-self: flex-start; padding-left: 16px; position: relative; }
  .msg.agent::before {
    content: ""; position: absolute; left: 0; top: 2px; bottom: 2px; width: 2px;
    background: var(--seal);
  }
  .msg.agent .who-label { color: var(--seal); }
  .msg.user {
    align-self: flex-end;
    background: var(--seal-soft);
    border: 1px solid #e5cfc8;
    padding: 12px 16px; border-radius: 2px;
  }
  .msg.user .who-label { color: var(--seal); text-align: right; }
  .msg.system {
    align-self: center; font-family: var(--mono); font-size: 11.5px;
    color: var(--muted); max-width: 90%;
  }
  .msg.pending .body::after {
    content: ""; display: inline-block; width: 7px; height: 14px;
    background: var(--seal); margin-left: 4px; vertical-align: -2px;
    animation: blink 1s steps(2) infinite;
  }
  .msg.streaming .body::after {
    content: ""; display: inline-block; width: 7px; height: 14px;
    background: var(--seal); margin-left: 4px; vertical-align: -2px;
    animation: blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  .tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tool {
    font-family: var(--mono); font-size: 10.5px; color: var(--muted);
    border: 1px solid var(--line); padding: 2px 7px;
  }
  .tool.ok { color: var(--green); border-color: #c3d2c8; }
  .tool.bad { color: var(--seal); border-color: #e3c8c2; }

  .composer {
    border-top: 1px solid var(--line);
    padding: 16px clamp(18px, 4vw, 56px) 22px;
    display: flex; gap: 14px; align-items: flex-end;
    background: rgba(250,250,246,.6);
  }
  .composer textarea {
    flex: 1; resize: none; background: transparent; border: none;
    border-bottom: 1px solid var(--line-strong);
    padding: 10px 2px 12px; font-size: 15px; line-height: 1.6;
    color: var(--ink); font-family: var(--sans);
    min-height: 46px; max-height: 160px;
  }
  .composer textarea:focus { outline: none; border-bottom: 2px solid var(--ink); }
  .composer textarea::placeholder { color: #9a9c93; }

  /* ---------- modal ---------- */
  .modal {
    position: fixed; inset: 0; z-index: 40;
    background: rgba(24,27,24,.45);
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .modal-card {
    width: min(400px, 100%);
    background: var(--paper-2);
    border: 1px solid var(--line-strong);
    border-top: 4px solid var(--seal);
    padding: 26px 26px 22px;
    box-shadow: 0 24px 60px rgba(24,27,24,.18);
  }
  .modal-card h3 {
    font-family: var(--serif); font-size: 20px; margin: 0 0 4px; font-weight: 700;
  }
  .modal-card .hint { font-size: 12.5px; color: var(--muted); margin: 0 0 18px; }
  .qr-frame {
    background: #fff; border: 1px solid var(--line);
    padding: 14px; display: grid; place-items: center;
  }
  .qr-frame img { width: 240px; height: 240px; object-fit: contain; display: block; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 16px; }

  @media (max-width: 860px) {
    .auth-screen { grid-template-columns: 1fr; }
    .auth-lede { padding: 56px 28px 20px; border-right: none; }
    .auth-lede::after { display: none; }
    .auth-panel { padding: 28px 28px 64px; }
    .layout { grid-template-columns: 1fr; }
    .side {
      border-right: none; border-bottom: 1px solid var(--line);
      flex-direction: row; align-items: flex-start; flex-wrap: wrap;
      gap: 18px 26px; padding: 14px 18px;
    }
    .side-block { flex: 0 0 auto; }
    .side-block h3 { margin-bottom: 8px; padding-bottom: 6px; font-size: 14px; }
    .side-block.ledger-block { display: none; }
    .side-actions { margin-top: 8px; }
    .side-actions .btn { padding: 7px 12px; }
    .side-hint { display: none; }
    .status-line { font-size: 12px; gap: 6px; }
    .chip { padding: 4px 8px; font-size: 11.5px; }
    .chat { padding: 22px 20px 16px; }
    .empty { padding: 10px 0; }
    .empty h2 { font-size: 22px; }
    .composer { padding: 12px 20px 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
    .chat { scroll-behavior: auto; }
  }
</style>
</head>
<body>

<!-- 登录 / 注册 -->
<div id="auth" class="auth-screen">
  <section class="auth-lede">
    <div class="stamp" aria-hidden="true">投</div>
    <div class="brandline">
      <h1 class="brand-title">投递台账</h1>
      <span class="brand-en">GetJobs Agent</span>
    </div>
    <p class="lede">把投递这件事，<br />交给<em>台账</em>。</p>
    <p class="lede-note">
      每个账号一套独立的浏览器环境与登录态。<br />
      你只管说方向，代理负责筛岗位、打招呼、记账。
    </p>
  </section>
  <section class="auth-panel">
    <h2>进入台账</h2>
    <p class="hint">登录已有账号，或直接注册一个新账号。</p>
    <div class="field">
      <label for="email">邮箱</label>
      <input id="email" type="email" autocomplete="username" placeholder="you@example.com" />
    </div>
    <div class="field">
      <label for="password">密码</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="至少 8 位" />
    </div>
    <div class="auth-actions">
      <button id="loginBtn" class="btn">登录</button>
      <button id="registerBtn" class="btn ghost">注册</button>
    </div>
    <div id="authError" class="error" role="alert"></div>
  </section>
</div>

<!-- 主界面 -->
<div id="app" class="app hidden">
  <header class="topbar">
    <div class="stamp" aria-hidden="true">投</div>
    <h1 class="brand-title">投递台账</h1>
    <span id="who" class="who"></span>
    <button id="logoutBtn" class="linkish">退出</button>
  </header>

  <div class="layout">
    <aside class="side">
      <div class="side-block">
        <h3>运行环境</h3>
        <div class="status-line">
          <span id="runnerDot" class="dot"></span>
          <span id="runnerText">未启动</span>
          <span id="runnerPort" class="port"></span>
        </div>
        <div class="side-actions">
          <button id="startRunner" class="btn tiny">启动</button>
          <button id="stopRunner" class="btn ghost tiny">停止</button>
        </div>
        <div id="runnerHint" class="side-hint"></div>
      </div>

      <div class="side-block">
        <h3>渠道</h3>
        <div id="channels" class="chips"></div>
        <div class="side-actions">
          <button id="loginBoss" class="btn ghost tiny">Boss 扫码登录</button>
        </div>
      </div>

      <div class="side-block ledger-block">
        <h3>台账</h3>
        <div class="ledger">
          <div><div id="statsTotal" class="num">—</div><div class="lbl">总记录</div></div>
          <div><div id="statsDelivered" class="num">—</div><div class="lbl">已投递</div></div>
          <div><div id="statsFiltered" class="num">—</div><div class="lbl">已过滤</div></div>
        </div>
      </div>
    </aside>

    <main class="main">
      <div id="chat" class="chat">
        <div id="empty" class="empty">
          <h2>说一句你想投的方向，<br />剩下的交给台账。</h2>
          <p>代理会补齐城市、薪资和经验条件，先给你过目，再开始打招呼。你随时可以叫停。</p>
          <div class="suggestions">
            <button class="suggestion" data-text="帮我投大模型方向，城市上海">投大模型方向 · 上海</button>
            <button class="suggestion" data-text="看看我现在的 Boss 投递配置">看看当前配置</button>
            <button class="suggestion" data-text="打开 Boss 登录二维码">打开登录二维码</button>
          </div>
        </div>
      </div>

      <form id="composer" class="composer">
        <textarea id="input" rows="1" placeholder="例如：帮我投大模型方向，城市上海"></textarea>
        <button id="sendBtn" class="btn" type="submit">发送</button>
      </form>
    </main>
  </div>
</div>

<!-- 二维码 -->
<div id="qrModal" class="modal hidden">
  <div class="modal-card">
    <h3>Boss 扫码登录</h3>
    <p class="hint">用 Boss 直聘 App 扫描二维码，登录态只保存在你的运行环境里。</p>
    <div class="qr-frame">
      <img id="qrImg" alt="Boss 登录二维码" />
    </div>
    <div class="modal-actions">
      <button id="refreshQr" class="btn ghost tiny">刷新</button>
      <button id="closeQr" class="btn tiny">关闭</button>
    </div>
    <div id="qrError" class="error" role="alert"></div>
  </div>
</div>

<script src="/assets/vendor/marked.min.js"></script>
<script src="/assets/vendor/purify.min.js"></script>
<script>
const state = {
  token: localStorage.getItem('getjobs_token') || '',
  user: null,
  sessionId: localStorage.getItem('getjobs_session') || '',
  busy: false,
  runnerRunning: false,
};
if (window.marked) marked.setOptions({ gfm: true, breaks: true });
const $ = (id) => document.getElementById(id);
const show = (id, yes) => $(id).classList.toggle('hidden', !yes);
const setError = (id, message) => { $(id).textContent = message || ''; };

async function api(path, options = {}) {
  const headers = Object.assign({ 'Content-Type': 'application/json' }, options.headers || {});
  if (state.token) headers['Authorization'] = 'Bearer ' + state.token;
  const res = await fetch(path, Object.assign({}, options, { headers }));
  if (res.status === 401 && state.token) { logout(); throw new Error('登录已过期，请重新登录'); }
  const text = await res.text();
  let data;
  try { data = text ? JSON.parse(text) : {}; } catch { data = text; }
  if (!res.ok) {
    let message = data;
    if (typeof data === 'object' && data) {
      message = data.detail || data.message || JSON.stringify(data);
      if (message && typeof message === 'object') message = message.message || JSON.stringify(message);
    }
    throw new Error(message || ('请求失败 ' + res.status));
  }
  return data;
}

function logout() {
  state.token = ''; state.user = null;
  localStorage.removeItem('getjobs_token');
  show('app', false); show('auth', true);
}

function addMessage(role, text, tools) {
  $('empty')?.remove();
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  if (role !== 'system') {
    const label = document.createElement('div');
    label.className = 'who-label';
    label.textContent = role === 'user' ? '我' : '代理';
    el.appendChild(label);
  }
  const body = document.createElement('div');
  body.className = 'body';
  body.textContent = text;
  el.appendChild(body);
  if (tools && tools.length) {
    const box = document.createElement('div');
    box.className = 'tools';
    tools.forEach(t => {
      const chip = document.createElement('span');
      const failed = t.result && t.result.error;
      chip.className = 'tool ' + (failed ? 'bad' : 'ok');
      chip.textContent = t.name + (failed ? ' ×' : ' ✓');
      box.appendChild(chip);
    });
    el.appendChild(box);
  }
  $('chat').appendChild(el);
  $('chat').scrollTop = $('chat').scrollHeight;
  return el;
}

async function loadMe() {
  const data = await api('/api/me');
  state.user = data.user;
  $('who').textContent = data.user.email;
  await loadRunner();
  await Promise.all([
    loadChannels(),
    state.runnerRunning ? loadStats() : Promise.resolve(),
  ]);
}

function setRunnerState(running, port) {
  state.runnerRunning = running;
  $('runnerDot').classList.toggle('on', running);
  $('runnerDot').classList.toggle('busy', state.busy);
  $('runnerText').textContent = running ? '运行中' : '未启动';
  $('runnerPort').textContent = running && port ? ':' + port : '';
  $('startRunner').disabled = running || state.busy;
  $('stopRunner').disabled = !running || state.busy;
  if (!running) {
    $('statsTotal').textContent = '—';
    $('statsDelivered').textContent = '—';
    $('statsFiltered').textContent = '—';
  }
}

async function loadRunner() {
  try {
    const data = await api('/api/me/runner');
    setRunnerState(!!data.running, data.port);
  } catch (e) { /* ignore */ }
}

async function loadChannels() {
  try {
    const data = await api('/api/channels');
    $('channels').innerHTML = '';
    data.channels.forEach(c => {
      const chip = document.createElement('span');
      chip.className = 'chip' + (c.maintained ? ' on' : '');
      chip.textContent = c.label + (c.maintained ? '' : '（不维护）');
      $('channels').appendChild(chip);
    });
  } catch (e) { /* ignore */ }
}

async function loadStats() {
  if (!state.runnerRunning) {
    $('statsTotal').textContent = '—';
    $('statsDelivered').textContent = '—';
    $('statsFiltered').textContent = '—';
    return;
  }
  try {
    const stats = await api('/api/channels/boss/stats');
    const kpi = stats.kpi || {};
    $('statsTotal').textContent = kpi.total ?? '—';
    $('statsDelivered').textContent = kpi.delivered ?? '—';
    $('statsFiltered').textContent = kpi.filtered ?? '—';
  } catch (e) {
    $('statsTotal').textContent = '—';
    $('statsDelivered').textContent = '—';
    $('statsFiltered').textContent = '—';
  }
}

async function startRunner() {
  state.busy = true;
  $('startRunner').disabled = true;
  $('runnerHint').textContent = '正在启动，首次约需 5–10 秒';
  setRunnerState(false, null);
  try {
    await api('/api/me/runner/start', { method: 'POST' });
    $('runnerHint').textContent = '';
  } catch (e) {
    $('runnerHint').textContent = e.message;
  }
  state.busy = false;
  $('startRunner').textContent = '启动';
  loadRunner().then(() => { if (state.runnerRunning) loadStats(); });
}

async function stopRunner() {
  state.busy = true;
  try { await api('/api/me/runner/stop', { method: 'POST' }); }
  catch (e) { $('runnerHint').textContent = e.message; }
  state.busy = false;
  loadRunner();
}

function ensureToolBox(container) {
  let box = container.querySelector('.tools');
  if (!box) {
    box = document.createElement('div');
    box.className = 'tools';
    container.appendChild(box);
  }
  return box;
}

function addToolChip(container, name, ok) {
  const box = ensureToolBox(container);
  const chip = document.createElement('span');
  chip.className = 'tool' + (ok === null ? '' : (ok ? ' ok' : ' bad'));
  chip.dataset.name = name;
  chip.textContent = name + (ok === null ? ' …' : (ok ? ' ✓' : ' ×'));
  box.appendChild(chip);
}

function updateToolChip(container, name, ok) {
  const box = container.querySelector('.tools');
  if (!box) return addToolChip(container, name, ok);
  const chips = [...box.querySelectorAll('.tool')].filter(c => c.dataset.name === name);
  const chip = chips.find(c => !c.classList.contains('ok') && !c.classList.contains('bad'))
    || chips[chips.length - 1];
  if (!chip) return addToolChip(container, name, ok);
  chip.className = 'tool ' + (ok ? 'ok' : 'bad');
  chip.textContent = name + (ok ? ' ✓' : ' ×');
}

function renderMarkdown(body, text) {
  if (window.marked && window.DOMPurify) {
    body.innerHTML = DOMPurify.sanitize(marked.parse(text || ''));
    body.classList.add('md');
  } else {
    body.textContent = text || '';
  }
}

async function sendMessage() {
  const input = $('input');
  const text = input.value.trim();
  if (!text || state.busy) return;
  input.value = '';
  input.style.height = 'auto';
  addMessage('user', text);

  state.busy = true;
  $('sendBtn').disabled = true;

  const el = addMessage('agent', '', null);
  el.classList.add('streaming');
  const body = el.querySelector('.body');
  body.textContent = '思考中…';
  let full = '';
  let scheduled = false;

  const render = () => {
    renderMarkdown(body, full || '');
    $('chat').scrollTop = $('chat').scrollHeight;
  };
  const scheduleRender = () => {
    if (scheduled) return;
    scheduled = true;
    setTimeout(() => { scheduled = false; render(); }, 80);
  };

  try {
    const res = await fetch('/api/agent/chat/stream', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Accept': 'text/event-stream',
        'Authorization': 'Bearer ' + state.token,
      },
      body: JSON.stringify({ message: text, session_id: state.sessionId || null }),
    });

    if (!res.ok) {
      let detail = '请求失败 ' + res.status;
      try {
        const data = await res.json();
        detail = data.detail || data.message || detail;
        if (detail && typeof detail === 'object') detail = detail.message || JSON.stringify(detail);
      } catch { /* ignore */ }
      throw new Error(detail);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let finished = false;

    const handle = (payload) => {
      let ev;
      try { ev = JSON.parse(payload); } catch { return; }
      if (ev.type === 'session') {
        state.sessionId = ev.sessionId;
        localStorage.setItem('getjobs_session', ev.sessionId);
      } else if (ev.type === 'text') {
        full += ev.text || '';
        scheduleRender();
      } else if (ev.type === 'tool_start') {
        addToolChip(el, ev.name, null);
      } else if (ev.type === 'tool_result') {
        updateToolChip(el, ev.name, !!ev.ok);
      } else if (ev.type === 'qr') {
        showQr(ev.url);
      } else if (ev.type === 'done') {
        full = ev.reply || full;
        render();
        state.sessionId = ev.sessionId;
        localStorage.setItem('getjobs_session', ev.sessionId);
        finished = true;
      } else if (ev.type === 'error') {
        throw new Error(ev.message || '模型返回错误');
      }
    };

    while (!finished) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      let index;
      while ((index = buffer.indexOf('\n\n')) >= 0) {
        const chunk = buffer.slice(0, index);
        buffer = buffer.slice(index + 2);
        for (const line of chunk.split('\n')) {
          if (line.startsWith('data:')) handle(line.slice(5).trim());
        }
      }
    }

    if (!full) body.textContent = '（无回复）';
    if (state.runnerRunning) loadStats();
  } catch (e) {
    body.textContent = '出错了：' + e.message;
    body.classList.remove('md');
  } finally {
    el.classList.remove('streaming');
    state.busy = false;
    $('sendBtn').disabled = false;
  }
}

async function openQr() {
  try {
    await api('/api/channels/boss/login', { method: 'POST' });
    await showQr('/api/channels/boss/login/qr');
  } catch (e) { addMessage('system', '打开登录页失败：' + e.message); }
}

async function showQr(url) {
  show('qrModal', true);
  setError('qrError', '');
  $('qrImg').removeAttribute('src');
  try {
    const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + state.token } });
    if (!res.ok) throw new Error('二维码获取失败 ' + res.status);
    const blob = await res.blob();
    $('qrImg').src = URL.createObjectURL(blob);
  } catch (e) {
    setError('qrError', e.message + '（请先点“Boss 扫码登录”）');
  }
}

function bind() {
  const submitAuth = async (path) => {
    setError('authError', '');
    try {
      const data = await api(path, {
        method: 'POST',
        body: JSON.stringify({ email: $('email').value, password: $('password').value }),
      });
      state.token = data.token;
      localStorage.setItem('getjobs_token', data.token);
      show('auth', false);
      show('app', true);
      loadMe();
    } catch (e) { setError('authError', e.message); }
  };

  $('loginBtn').onclick = () => submitAuth('/api/auth/login');
  $('registerBtn').onclick = () => submitAuth('/api/auth/register');
  $('password').addEventListener('keydown', e => { if (e.key === 'Enter') submitAuth('/api/auth/login'); });
  $('logoutBtn').onclick = logout;
  $('startRunner').onclick = startRunner;
  $('stopRunner').onclick = stopRunner;
  $('loginBoss').onclick = openQr;
  $('closeQr').onclick = () => show('qrModal', false);
  $('refreshQr').onclick = () => showQr('/api/channels/boss/login/qr');

  $('composer').addEventListener('submit', e => { e.preventDefault(); sendMessage(); });
  $('input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMessage(); }
  });
  $('input').addEventListener('input', () => {
    const el = $('input');
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 160) + 'px';
  });

  document.querySelectorAll('.suggestion').forEach(btn => {
    btn.onclick = () => {
      $('input').value = btn.dataset.text || '';
      $('input').focus();
    };
  });
}

bind();
if (state.token) {
  show('auth', false);
  show('app', true);
  loadMe().catch(() => logout());
}
setInterval(() => { if (state.token && !state.busy) loadRunner(); }, 5000);
</script>
</body>
</html>
